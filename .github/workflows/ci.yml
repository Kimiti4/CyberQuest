name: foundation-ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "pytest==9.2.0"
      - name: Run foundation tests
        run: python -m pytest
