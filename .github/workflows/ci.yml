name: foundation-ci

on:
  push:
    branches: [main, feat/cq-00-5-cross-platform-builds]
  pull_request:
  workflow_dispatch:

concurrency:
  group: foundation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cyberquest
          POSTGRES_USER: cyberquest
          POSTGRES_PASSWORD: cyberquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberquest -d cyberquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cyberquest:cyberquest@localhost:5432/cyberquest
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip
      - name: Install pinned dependency lock compiler
        run: python -m pip install --disable-pip-version-check "pip-tools==7.6.2"
      - name: Verify committed lock is up to date with pyproject.toml
        run: |
          mkdir -p "${RUNNER_TEMP}/lock-check"
          cp pyproject.toml "${RUNNER_TEMP}/lock-check/"
          cd "${RUNNER_TEMP}/lock-check"
          python -m piptools compile \
            --all-extras \
            --generate-hashes \
            --allow-unsafe \
            --resolver=backtracking \
            --output-file=requirements-lock.txt \
            pyproject.toml
          diff -u "${GITHUB_WORKSPACE}/requirements-lock.txt" "${RUNNER_TEMP}/lock-check/requirements-lock.txt"
      - name: Install from committed hash-locked lock
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Apply database migration
        run: alembic upgrade head
      - name: Verify migration schema
        run: python -m pytest tests/test_migration_schema.py
      - name: Verify migration downgrade and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Run complete test suite
        run: python -m pytest

      - name: Preserve generated lock for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: cq00-python-dependency-lock
          path: requirements-lock.txt
          if-no-files-found: error
          retention-days: 7
