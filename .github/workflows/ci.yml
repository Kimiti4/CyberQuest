name: foundation-ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cyberquest
          POSTGRES_USER: cyberquest
          POSTGRES_PASSWORD: cyberquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberquest -d cyberquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cyberquest:cyberquest@localhost:5432/cyberquest
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply database migration
        run: alembic upgrade head
      - name: Verify migration schema
        run: python -m pytest tests/test_migration_schema.py
      - name: Verify migration downgrade and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Run complete test suite
        run: python -m pytest
