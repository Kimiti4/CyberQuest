name: cross-platform-foundation-ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cq00-5-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android clean build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout v4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # pinned setup-java commit
        with:
          distribution: temurin
          java-version: "17.0.17+10"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Install pinned Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Gradle wrapper distribution
        working-directory: android
        run: sh ./gradlew --version
      - name: Run clean Android build, unit tests and lint
        working-directory: android
        run: sh ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lint

  web:
    name: Web clean install, contract tests and production build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned checkout v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pinned setup-node commit
        with:
          node-version: "24.22.3"
      - name: Bootstrap lock only when absent (first-run migration step)
        working-directory: web
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --no-audit --no-fund
          fi
      - name: Install exact locked dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Verify runtime versions
        working-directory: web
        run: |
          test "$(node --version)" = "v24.22.3"
          test "$(npm --version)" = "11.19.1"
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Run contract tests
        working-directory: web
        run: npm test
      - name: Lint OpenAPI contract
        working-directory: web
        run: npm run api:lint
      - name: Build production web application
        working-directory: web
        run: npm run build
      - name: Upload package lock bootstrap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned upload-artifact v4
        with:
          name: cq00-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated npm lockfile (bootstrap only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: web
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change to commit."
          else
            git commit -m "build(web): commit npm dependency lock"
            git push origin "HEAD:refs/heads/${BRANCH_NAME}"
          fi

  web-lock-replay:
    name: Web clean-checkout lockfile replay
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned checkout v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pinned setup-node commit
        with:
          node-version: "24.22.3"
      - name: Install from committed lockfile
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Verify runtime versions
        working-directory: web
        run: |
          test "$(node --version)" = "v24.22.3"
          test "$(npm --version)" = "11.19.1"
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Run contract tests
        working-directory: web
        run: npm test
      - name: Lint OpenAPI contract
        working-directory: web
        run: npm run api:lint
      - name: Build production web application
        working-directory: web
        run: npm run build
