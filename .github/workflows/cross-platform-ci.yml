name: cross-platform-foundation-ci

on:
  push:
    branches: [feat/cq-00-5-cross-platform-builds]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cq00-5-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-linux:
    name: Android clean build, unit tests and lint (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # actions/setup-java v6.2.0
        with:
          distribution: temurin
          java-version: "17.0.17+10"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Install pinned Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Gradle wrapper distribution
        working-directory: android
        run: sh ./gradlew --version
      - name: Run clean Android build, unit tests and lint without build cache
        working-directory: android
        run: sh ./gradlew --no-daemon --no-build-cache clean testDebugUnitTest assembleDebug lint
      - name: Publish demo debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: cyberquest-cq-00-7-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-windows-wrapper:
    name: Android Gradle wrapper smoke test (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # actions/setup-java v6.2.0
        with:
          distribution: temurin
          java-version: "17.0.17+10"
      - name: Verify Windows wrapper materialization, checksum and Gradle distribution
        working-directory: android
        run: .\gradlew.bat --version

  web:
    name: Web clean install, contract tests and production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: "24.22.3"
      - name: Install from committed npm lockfile
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Verify runtime versions
        working-directory: web
        run: |
          test "$(node --version)" = "v24.22.3"
          test "$(npm --version)" = "11.19.1"
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Run contract tests
        working-directory: web
        run: npm test
      - name: Lint OpenAPI contract
        working-directory: web
        run: npm run api:lint
      - name: Build production web application
        working-directory: web
        run: npm run build

  demo-integration:
    name: FastAPI and Next.js demo integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: "3.12.16"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: "24.22.3"
      - name: Install hash-locked backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build web application
        working-directory: web
        run: npm run build
      - name: Start FastAPI demo API
        run: |
          PYTHONPATH=src python -m uvicorn cyberquest.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/cyberquest-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cyberquest-api.log"
          exit 1
      - name: Start Next.js production server
        working-directory: web
        env:
          CYBERQUEST_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/cyberquest-web.log" 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/demo/mission >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cyberquest-web.log"
          exit 1
      - name: Verify live API-to-web-proxy assessment flow
        run: python scripts/verify_demo_integration.py
