name: cross-platform-foundation-ci

on:
  push:
    branches: ["feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android clean build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned checkout v4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # pinned setup-java commit
        with:
          distribution: temurin
          java-version: "17.0.17+10"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Install pinned Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Gradle wrapper distribution
        working-directory: android
        run: ./gradlew --version
      - name: Run clean Android build, unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lint

  web:
    name: Web clean install, contract tests and production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned checkout v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pinned setup-node commit
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bootstrap lock only when absent (first-run migration step)
        working-directory: web
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Install exact locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify runtime versions
        working-directory: web
        run: |
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Run contract tests
        working-directory: web
        run: npm test
      - name: Lint OpenAPI contract
        working-directory: web
        run: npm run api:lint
      - name: Build production web application
        working-directory: web
        run: npm run build
      - name: Upload package lock bootstrap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned upload-artifact v4
        with:
          name: cq00-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 7
