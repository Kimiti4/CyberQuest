name: cross-platform-foundation-ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cq00-5-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android clean build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # actions/setup-java v6.2.0
        with:
          distribution: temurin
          java-version: "17.0.17+10"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Install pinned Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Gradle wrapper distribution
        working-directory: android
        run: sh ./gradlew --version
      - name: Run clean Android build, unit tests and lint
        working-directory: android
        run: sh ./gradlew --no-daemon --no-build-cache clean testDebugUnitTest assembleDebug lint

  web:
    name: Web clean install, contract tests and production build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: "24.22.3"
      - name: Bootstrap lock only when absent (first-run migration step)
        working-directory: web
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --no-audit --no-fund
          fi
      - name: Install exact locked dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Verify runtime versions
        working-directory: web
        run: |
          test "$(node --version)" = "v24.22.3"
          test "$(npm --version)" = "11.19.1"
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Run contract tests
        working-directory: web
        run: npm test
      - name: Lint OpenAPI contract
        working-directory: web
        run: npm run api:lint
      - name: Build production web application
        working-directory: web
        run: npm run build
      - name: Upload package lock bootstrap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: cq00-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 7

  commit-web-lock:
    name: Commit npm lockfile with isolated write permission
    needs: web
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          name: cq00-web-package-lock
          path: artifact
      - name: Commit generated lockfile to the PR branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          test -s artifact/package-lock.json
          install -D artifact/package-lock.json web/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Committed npm lockfile is already current."
          else
            git commit -m "build(web): commit npm dependency lock"
            git push origin "HEAD:refs/heads/${BRANCH_NAME}"
          fi

  web-lock-replay:
    name: Web clean-checkout lockfile replay
    needs: [web, commit-web-lock]
    if: ${{ always() && needs.web.result == 'success' && (needs.commit-web-lock.result == 'success' || needs.commit-web-lock.result == 'skipped') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: "24.22.3"
      - name: Install from committed lockfile
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Verify runtime versions
        working-directory: web
        run: |
          test "$(node --version)" = "v24.22.3"
          test "$(npm --version)" = "11.19.1"
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Run contract tests
        working-directory: web
        run: npm test
      - name: Lint OpenAPI contract
        working-directory: web
        run: npm run api:lint
      - name: Build production web application
        working-directory: web
        run: npm run build
