name: dependency-lock-bootstrap

on:
  push:
    branches: ["feat/cq-00-3-dependency-lock"]
  pull_request:
    branches: [main, "feat/cq-00-foundation"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-and-verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cyberquest
          POSTGRES_USER: cyberquest
          POSTGRES_PASSWORD: cyberquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberquest -d cyberquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cyberquest:cyberquest@localhost:5432/cyberquest
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.16"
      - name: Install pinned lock compiler
        run: python -m pip install --disable-pip-version-check "pip-tools==7.6.2"
      - name: Resolve all declared extras with artifact hashes
        run: >-
          python -m piptools compile
          --all-extras
          --generate-hashes
          --allow-unsafe
          --resolver=backtracking
          --output-file=requirements-lock.txt
          pyproject.toml
      - name: Install from generated hash-locked resolution
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
      - name: Verify resolved environment
        run: |
          alembic upgrade head
          python -m pip check
          python -m pytest
      - name: Preserve generated lock for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cq00-python-dependency-lock
          path: requirements-lock.txt
          if-no-files-found: error
          retention-days: 7
